// LockScope engine: shared build conventions for all subprojects.
allprojects {
    group = 'io.lockscope'
    version = '0.1.0'
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17 // bytecode targets the oldest supported LTS; builds on JDK 17, 21 and newer
        options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Werror']
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxParallelForks = 1 // concurrency tests need the CPUs to themselves
        testLogging {
            events 'failed', 'skipped'
            exceptionFormat = 'full'
            showStandardStreams = false
        }
        // Heavier stress tiers are opt-in: ./gradlew test -Plockscope.stress=heavy
        systemProperty 'lockscope.stress', project.findProperty('lockscope.stress') ?: 'standard'
    }
}
