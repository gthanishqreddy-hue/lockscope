# Some networks (including the machine this project was developed on) time out when the
# JVM tries IPv6 first. Preferring IPv4 is harmless elsewhere.
org.gradle.jvmargs=-Xmx1g -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8
systemProp.java.net.preferIPv4Stack=true
org.gradle.caching=true

jmhVersion=1.37
jacksonVersion=2.22.4
jcstressVersion=0.16
