# Runs a benchmark profile on a GitHub-hosted runner and uploads the result files.
# Manual only: benchmarks take minutes and shared CI machines are noisy, so treat these results
# as a second environment for comparison, not as reference numbers (see docs/benchmarking.md).
name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Workload profile (see `lockscope profiles`)
        default: lock-high-contention
      threads:
        description: Comma-separated thread counts
        default: '1,2,4'
      runner:
        description: Runner label
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  bench:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Benchmark
        working-directory: engine
        run: >
          ./gradlew --no-daemon :bench:run
          --args="bench --profile ${{ inputs.profile }} --threads ${{ inputs.threads }} --quiet
          --out benchmark-results/local/ci-${{ inputs.profile }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.profile }}
          path: benchmark-results/local/
