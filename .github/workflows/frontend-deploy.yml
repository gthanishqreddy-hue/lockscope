# Optional: deploy the static dashboard to Cloudflare Pages from GitHub Actions.
# Simpler alternative: connect the repository in the Cloudflare dashboard (Git integration);
# then this workflow is unnecessary. See docs/deployment.md.
#
# Requires repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID,
# and a repository variable CF_PAGES_PROJECT with the Pages project name. Without them the job
# is skipped rather than failing.
name: Deploy dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-deploy.yml']

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: ${{ vars.CF_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ vars.CF_PAGES_PROJECT }}
