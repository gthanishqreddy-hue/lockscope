# Deploys the static dashboard to GitHub Pages: https://<owner>.github.io/<repo>/
# GitHub Pages cannot set response headers or rewrites, so the build embeds the
# Content-Security-Policy as a <meta> tag and copies index.html to 404.html as the
# single-page-app fallback (deep links are served with HTTP status 404, then routed client-side).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build for the project sub-path
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          CSP_META: '1'
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: Single-page-app fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
